name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Run frontend tests
        run: pnpm test --run

      - name: Build frontend
        run: pnpm build
