[project]
name = "ad-sentry"
version = "0.1.0"
description = "Internal monitoring and compliance engine tracking system telemetry, performance metrics, and audit logs."
authors = [{ name = "Angelo", email = "angelo@example.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.14.2",
    "uvicorn>=0.40.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "redis>=8.0.1",
    "structlog>=26.1.0",
    "reportlab>=4.4.0",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
    "ty>=0.0.59",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["B008", "E501"]

[tool.ty]
