networks:
  app:

volumes:
  # pgsql-data:
  redis-data:

services:
  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    env_file:
      - ../client/.env
    ports:
      - 3000:3000
    volumes:
      - ../client:/app
      - /app/node_modules
    networks:
      - app
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512m
        reservations:
          memory: 256m

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    env_file:
      - ../server/.env
    ports:
      - 3001:3001
    volumes:
      - ../server:/app
      - /app/.venv
    networks:
      - app
    depends_on:
      # - pgsql
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
        reservations:
          memory: 128m

  # pgsql:
  #   image: postgres:18-trixie
